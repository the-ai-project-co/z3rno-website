<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0C0C0E"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A1A1E" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Glow effect behind the 3 -->
  <circle cx="600" cy="260" r="120" fill="#00D4AA" opacity="0.04"/>
  <circle cx="600" cy="260" r="80" fill="#00D4AA" opacity="0.06"/>

  <!-- Main wordmark -->
  <text x="600" y="280" dominant-baseline="middle" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2">
    <tspan fill="#EDEDED">Z</tspan><tspan fill="#00D4AA">3</tspan><tspan fill="#EDEDED">rno</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="350" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="400" fill="#71717A" letter-spacing="4">THE MEMORY LAYER FOR AI AGENTS</text>

  <!-- Three memory tier indicators -->
  <rect x="430" y="410" width="100" height="3" rx="1.5" fill="#A78BFA" opacity="0.8"/>
  <text x="480" y="435" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#A78BFA" letter-spacing="1">EPISODIC</text>

  <rect x="550" y="410" width="100" height="3" rx="1.5" fill="#FBBF24" opacity="0.8"/>
  <text x="600" y="435" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#FBBF24" letter-spacing="1">SEMANTIC</text>

  <rect x="670" y="410" width="100" height="3" rx="1.5" fill="#FB7185" opacity="0.8"/>
  <text x="720" y="435" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#FB7185" letter-spacing="1">PROCEDURAL</text>

  <!-- Bottom bar -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" fill="#3F3F46">pip install z3rno  •  z3rno.dev  •  Apache 2.0</text>
</svg>